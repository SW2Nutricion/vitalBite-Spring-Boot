spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vitalbite}
spring.datasource.username=${DB_USER:vitalbite}
spring.datasource.password=${DB_PASSWORD:vitalbite}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.profiles.group.local=
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/vitalbite}
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
